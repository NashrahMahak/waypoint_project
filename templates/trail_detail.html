<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ trail.name }} - Detail</title>
</head>
<body>
    <div style="max-width: 800px; margin: 20px auto; font-family: sans-serif;">
        <h2>{{ trail.name }}</h2>
        
        <p><strong>Distance:</strong> {{ trail.distance_km|floatformat:1 }} km</p>
        <p><strong>Elevation Gain:</strong> {{ trail.elevation_gain }} m</p>
        <p><strong>Difficulty Level:</strong> {{ trail.get_difficulty_display }}</p>
        <p><strong>Status:</strong> 
            {% if trail.is_open %}
                Open
            {% else %}
                Closed
            {% endif %}
        </p>

        <a href="{% url 'home' %}">&larr; Back to Catalog</a>
    </div>
</body>
</html>
